env:
  contexts:
    - name: RedShop

      urls:
        - "http://192.168.59.135/"

      includePaths:
        - "http://192\\.168\\.59\\.135/.*"

      excludePaths:
        - "http://192\\.168\\.59\\.135/logout.*"

      authentication:
        method: browser

        parameters:
          loginPageUrl: "http://192.168.59.135/login"
          browserId: firefox-headless
          loginPageWait: 3
          stepDelay: 0
          diagnostics: true

        verification:
          method: poll
          loggedInRegex: "My Account|Account|Profile|Dashboard|Diagnostics"
          loggedOutRegex: "Welcome back|Sign in|Login"
          pollFrequency: 1
          pollUnits: requests
          pollUrl: "http://192.168.59.135/account"
          pollPostData: ""

      sessionManagement:
        method: autodetect

      users:
        - name: dast-user
          credentials:
            username: peyman
            password: peyman


parameters:
  failOnError: true
  failOnWarning: false
  continueOnFailure: true
  progressToStdout: true


jobs:

  # ==========================================================
  # 1. Spider
  # ==========================================================

  - type: spider

    parameters:
      context: RedShop
      user: dast-user
      url: "http://192.168.59.135/"

      maxDuration: 5
      maxDepth: 10
      maxChildren: 100

      acceptCookies: true
      handleParameters: use_all
      logoutAvoidance: true

      parseComments: true
      parseGit: false

      postForm: false
      processForm: false

      sendRefererHeader: true


  # ==========================================================
  # 2. Default ZAP Active Scan
  #
  # No custom active-scan policy is defined here.
  # ZAP will use its default Active Scan policy.
  # ==========================================================

  - type: activeScan

    parameters:
      context: RedShop
      user: dast-user

      maxRuleDurationInMins: 5
      maxScanDurationInMins: 3


  # ==========================================================
  # 3. Report
  # ==========================================================

  - type: report

    parameters:
      template: traditional-html
      reportDir: /zap/wrk/redshop-dast/
      reportFile: zap-report.html
      reportTitle: "RedShop DAST Security Report"