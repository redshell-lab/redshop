env:
  contexts:
    - name: RedShop

      urls:
        - "http://192.168.59.135/"

      includePaths:
        - "http://192\\.168\\.59\\.135/.*"

      excludePaths:
        - "http://192\\.168\\.59\\.135/logout.*"

      authentication:
        method: browser

        parameters:
          loginPageUrl: "http://192.168.59.135/login"
          browserId: firefox-headless
          loginPageWait: 3
          stepDelay: 0
          diagnostics: true

        verification:
          method: poll
          loggedInRegex: "My Account|Account|Profile|Dashboard|Diagnostics"
          loggedOutRegex: "Welcome back|Sign in|Login"
          pollFrequency: 1
          pollUnits: requests
          pollUrl: "http://192.168.59.135/account"
          pollPostData: ""

      sessionManagement:
        method: autodetect

      users:
        - name: dast-user
          credentials:
            username: peyman
            password: peyman


parameters:
  failOnError: true
  failOnWarning: false
  continueOnFailure: true
  progressToStdout: true


jobs:

  # ==========================================================
  # 1. Traditional Spider
  #
  # Discovers URLs, links, forms and parameters from the
  # server-side application.
  #
  # Form submission is intentionally disabled at this stage
  # to reduce unintended state changes in the database.
  # ==========================================================

  - type: spider
    parameters:
      context: RedShop
      user: dast-user
      url: "http://192.168.59.135/"

      maxDuration: 5
      maxDepth: 10
      maxChildren: 100

      acceptCookies: true
      handleParameters: use_all

      logoutAvoidance: true

      parseComments: true
      parseGit: false

      postForm: false
      processForm: false

      sendRefererHeader: true


  # ==========================================================
  # 2. Client Spider
  #
  # Discovers client-side resources and URLs that may not be
  # discovered by the traditional Spider.
  # ==========================================================

  - type: spiderClient
    parameters:
      context: RedShop
      user: dast-user
      url: "http://192.168.59.135/"

      maxDuration: 5
      maxCrawlDepth: 5
      maxChildren: 100


  # ==========================================================
  # 3. REST API Requestor
  #
  # These are normal, non-malicious GET requests.
  #
  # Purpose:
  #   - Make the REST API visible to ZAP
  #   - Allow Passive Scanner to inspect API responses
  #   - Allow the default Active Scanner to scan these endpoints
  #
  # No vulnerability-specific payload is used here.
  # ==========================================================

  - type: requestor
    parameters:
      user: dast-user

    requests:

      - url: "http://192.168.59.135/api/products"
        name: "API - Products"
        method: GET
        httpVersion: "HTTP/1.1"

      - url: "http://192.168.59.135/api/products/1"
        name: "API - Product Detail"
        method: GET
        httpVersion: "HTTP/1.1"


  # ==========================================================
  # 4. Passive Scan Wait
  #
  # Wait for Passive Scanner to finish processing traffic
  # generated by:
  #
  #   - Traditional Spider
  #   - Client Spider
  #   - API Requestor
  #
  # Passive scanning does not actively attack the application.
  # ==========================================================

  - type: passiveScan-wait
    parameters:
      maxDuration: 5


  # ==========================================================
  # 5. Default ZAP Active Scan
  #
  # IMPORTANT:
  #
  # No custom Active Scan policy is defined.
  # No custom Active Scan rules are defined.
  #
  # ZAP therefore uses its built-in Default Policy.
  # ==========================================================

  - type: activeScan
    parameters:
      context: RedShop
      user: dast-user

      maxRuleDurationInMins: 5
      maxScanDurationInMins: 3


  # ==========================================================
  # 6. Passive Scan Wait - After Active Scan
  #
  # Active Scan generates additional HTTP traffic.
  #
  # Wait again so that Passive Scanner can finish processing
  # those responses before the report is generated.
  # ==========================================================

  - type: passiveScan-wait
    parameters:
      maxDuration: 5


  # ==========================================================
  # 7. Report
  # ==========================================================

  - type: report
    parameters:
      template: modern
      reportDir: /zap/wrk/redshop-dast/
      reportFile: zap-report.html
      reportTitle: "RedShop DAST Security Report"

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/redshop-dast/
      reportFile: zap-report.json
      reportTitle: "RedShop DAST Security Report"