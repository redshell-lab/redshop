env:

  contexts:

    - name: RedShop

      urls:
        - "http://192.168.59.135/"

      includePaths:
        - "http://192\\.168\\.59\\.135/.*"

      excludePaths:
        - "http://192\\.168\\.59\\.135/logout.*"

      authentication:

        method: browser

        parameters:

          loginPageUrl: "http://192.168.59.135/login"

          browserId: firefox-headless

          loginPageWait: 3

          stepDelay: 0

          diagnostics: true

        verification:

          method: poll

          loggedInRegex: "My Account|Account|Profile"

          loggedOutRegex: "Welcome back|Sign in|Login"

          pollFrequency: 1

          pollUnits: requests

          pollUrl: "http://192.168.59.135/account"

          pollPostData: ""

      sessionManagement:

        method: autodetect

      users:

        - name: dast-user

          credentials:

            username: peyman
            password: peyman


  parameters:

    failOnError: true

    failOnWarning: false

    continueOnFailure: true

    progressToStdout: true


jobs:

  - type: spider

    parameters:

      context: RedShop
      user: dast-user

      url: "http://192.168.59.135/"

      maxDuration: 5
      maxDepth: 10
      maxChildren: 50

      acceptCookies: true

      handleParameters: use_all

      logoutAvoidance: true

      parseComments: true
      parseGit: false

      postForm: true
      processForm: true

      sendRefererHeader: true


  - type: activeScan-policy

    parameters:

      name: "RedShop-DAST"

    policyDefinition:

      defaultStrength: "Medium"
      defaultThreshold: "Off"

      rules:

        - id: 40014
          name: "Cross Site Scripting (Persistent)"
          strength: "High"
          threshold: "Low"

        - id: 40012
          name: "Cross Site Scripting (Reflected)"
          strength: "High"
          threshold: "Low"

        - id: 6
          name: "Path Traversal"
          strength: "High"
          threshold: "Low"

        - id: 90020
          name: "Remote OS Command Injection"
          strength: "High"
          threshold: "Low"

        - id: 90037
          name: "Remote OS Command Injection (Time Based)"
          strength: "Medium"
          threshold: "Low"


  - type: activeScan-config

    parameters:

      maxRuleDurationInMins: 10

      maxScanDurationInMins: 30

      maxAlertsPerRule: 10

      defaultPolicy: "RedShop-DAST"

      handleAntiCSRFTokens: true

      injectPluginIdInHeader: true

      threadPerHost: 1


  - type: activeScan

    parameters:

      context: RedShop

      user: dast-user

      policy: "RedShop-DAST"

      maxRuleDurationInMins: 10

      maxScanDurationInMins: 30


  - type: report

    parameters:

      template: traditional-html

      reportDir: /zap/wrk/redshop-dast/

      reportFile: zap-report.html

      reportTitle: "RedShop DAST Security Report"