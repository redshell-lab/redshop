<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Products')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-md">

            <h1 class="page-title">
                Products
            </h1>

            <p class="page-subtitle">
                Explore products available in RedShop.
            </p>

            <form
                    method="get"
                    action="/products"
                    class="product-search">

                <input
                        type="search"
                        name="search"
                        th:value="${search}"
                        placeholder="Search products..."
                        aria-label="Search products">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Search
                </button>

            </form>

            <div class="mb-md">
                <h2>Image Preview</h2>

                <form
                        method="post"
                        action="/products/preview-image">

                    <input
                            type="url"
                            name="url"
                            placeholder="https://example.com/image.jpg"
                            required>

                    <button
                            type="submit"
                            class="btn btn-primary">
                        Preview
                    </button>

                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">
                </form>
            </div>

        </div>

        <div class="product-grid">

            <article class="product-card"
                     th:each="product : ${products}">

                <h2 class="product-card-title">

                    <a th:href="@{/products/{id}(id=${product.id})}"
                       th:text="${product.name}">
                        Product Name
                    </a>

                </h2>

                <p class="product-card-description"
                   th:text="${product.description}">
                    Product description
                </p>

                <div class="product-price">
                    $
                    <span th:text="${product.price}">
                        0.00
                    </span>
                </div>

                <div class="product-meta">

                    <span>
                        <span th:text="${product.category.name}">
                            Category
                        </span>
                    </span>

                    <span>
                        Stock:
                        <span th:text="${product.stock}">
                            0
                        </span>
                    </span>

                </div>

            </article>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
