<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header(${product.name})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <p class="mb-md">
            <a class="text-secondary"
               href="/products">
                ← Back to products
            </a>
        </p>

        <section class="card product-detail">

            <h1 class="page-title"
                th:text="${product.name}">
                Product Name
            </h1>

            <p class="product-detail-description"
               th:text="${product.description}">
                Product description
            </p>

            <div class="product-detail-price">

                $
                <span th:text="${product.price}">
                    0.00
                </span>

            </div>

            <div class="product-meta">

                <span>
                    Category:
                    <strong th:text="${product.category.name}">
                        Category
                    </strong>
                </span>

                <span>
                    Stock:
                    <strong th:text="${product.stock}">
                        0
                    </strong>
                </span>

            </div>

            <div class="mt-lg">

                <form th:action="@{/cart/add}"
                      method="post">

                    <div class="form-group">

                        <label class="form-label"
                               for="quantity">
                            Quantity
                        </label>

                        <input
                                type="number"
                                id="quantity"
                                name="quantity"
                                min="1"
                                value="1"
                                style="max-width: 140px;"
                        >

                    </div>

                    <input
                            type="hidden"
                            name="productId"
                            th:value="${product.id}"
                    >

                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                    >

                    <button
                            type="submit"
                            class="btn btn-primary">
                        Add to Cart
                    </button>

                </form>

            </div>

        </section>

        <section class="reviews-section">

            <div class="mb-md">
                <h2 class="section-title">Reviews</h2>

                <p class="page-subtitle"
                   th:if="${#lists.isEmpty(reviews)}">
                    No reviews yet.
                </p>
            </div>

            <div class="reviews-list"
                 th:if="${!#lists.isEmpty(reviews)}">

                <article class="review-card"
                         th:each="review : ${reviews}">

                    <div class="review-header">

                        <strong class="review-author"
                                th:text="${review.user.firstName + ' ' + review.user.lastName}">
                            User Name
                        </strong>

                        <time class="review-date"
                              th:text="${#temporals.format(review.createdAt, 'MMM d, yyyy')}">
                            Sep 24, 2026
                        </time>

                    </div>

                    <p class="review-content"
                       th:text="${review.content}">
                        Review content
                    </p>

                </article>

            </div>


            <div class="card review-form-card">

                <h2 class="section-title">
                    Write a Review
                </h2>

                <form
                        th:action="@{/products/{productId}/reviews(productId=${product.id})}"
                        method="post">

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="review-content">
                            Your Review
                        </label>

                        <textarea
                                id="review-content"
                                name="content"
                                rows="5"
                                maxlength="2000"
                                required
                                placeholder="Share your experience with this product..."></textarea>

                    </div>

                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}">

                    <button
                            type="submit"
                            class="btn btn-primary">
                        Submit Review
                    </button>

                </form>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
