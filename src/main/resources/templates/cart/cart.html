<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - RedShop</title>
</head>

<body>

<h1>Shopping Cart</h1>

<p>
    <a href="/products">Products</a>
    |
    <a href="/account">My Account</a>
    |
    <a href="/orders">My Orders</a>
</p>

<div th:if="${cart.items.isEmpty()}">

    <p>Your cart is empty.</p>

</div>

<div th:unless="${cart.items.isEmpty()}">

    <table border="1" cellpadding="10">

        <thead>
        <tr>
            <th>Product</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="item : ${cart.items}">

            <td>
                <a
                        th:href="@{/products/{id}(id=${item.product.id})}"
                        th:text="${item.product.name}">
                    Product
                </a>
            </td>

            <td th:text="${item.product.price}">
                0.00
            </td>

            <td>

                <form th:action="@{/cart/update}" method="post">

                    <input
                            type="hidden"
                            name="itemId"
                            th:value="${item.id}"
                    >

                    <input
                            type="number"
                            name="quantity"
                            min="0"
                            th:value="${item.quantity}"
                    >

                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                    >

                    <button type="submit">
                        Update
                    </button>

                </form>

            </td>

            <td th:text="${item.subtotal}">
                0.00
            </td>

            <td>

                <form th:action="@{/cart/remove}" method="post">

                    <input
                            type="hidden"
                            name="itemId"
                            th:value="${item.id}"
                    >

                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                    >

                    <button type="submit">
                        Remove
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

    <h2>
        Total:
        $<span th:text="${cart.total}">0.00</span>
    </h2>

    <p>
        <a href="/checkout">
            Proceed to Checkout
        </a>
    </p>

</div>

</body>
</html>
