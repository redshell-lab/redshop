<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Shopping Cart')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                Shopping Cart
            </h1>

            <p class="page-subtitle">
                Review your items before checkout.
            </p>

        </div>

        <!-- Empty Cart -->

        <div class="card"
             th:if="${cart.items.isEmpty()}">

            <div class="empty-state">

                <h2 class="section-title">
                    Your cart is empty
                </h2>

                <p class="text-secondary">
                    There are no products in your shopping cart yet.
                </p>

                <a class="btn btn-primary mt-md"
                   href="/products">
                    Browse Products
                </a>

            </div>

        </div>


        <!-- Cart -->

        <div th:unless="${cart.items.isEmpty()}">

            <div class="table-wrapper">

                <table class="data-table">

                    <thead>

                    <tr>

                        <th>
                            Product
                        </th>

                        <th>
                            Unit Price
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Subtotal
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="item : ${cart.items}">

                        <td>

                            <a class="table-link"
                               th:href="@{/products/{id}(id=${item.product.id})}"
                               th:text="${item.product.name}">
                                Product
                            </a>

                        </td>

                        <td>

                            $
                            <span th:text="${item.product.price}">
                                0.00
                            </span>

                        </td>

                        <td>

                            <form th:action="@{/cart/update}"
                                  method="post"
                                  class="quantity-form">

                                <input
                                        type="number"
                                        name="quantity"
                                        min="0"
                                        th:value="${item.quantity}"
                                        class="quantity-input"
                                >

                                <input
                                        type="hidden"
                                        name="itemId"
                                        th:value="${item.id}"
                                >

                                <input
                                        type="hidden"
                                        th:name="${_csrf.parameterName}"
                                        th:value="${_csrf.token}"
                                >

                                <button
                                        type="submit"
                                        class="btn btn-secondary btn-sm">
                                    Update
                                </button>

                            </form>

                        </td>

                        <td>

                            $
                            <span th:text="${item.subtotal}">
                                0.00
                            </span>

                        </td>

                        <td>

                            <form th:action="@{/cart/remove}"
                                  method="post">

                                <input
                                        type="hidden"
                                        name="itemId"
                                        th:value="${item.id}"
                                >

                                <input
                                        type="hidden"
                                        th:name="${_csrf.parameterName}"
                                        th:value="${_csrf.token}"
                                >

                                <button
                                        type="submit"
                                        class="btn btn-danger btn-sm">
                                    Remove
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>


            <!-- Cart Summary -->

            <section class="cart-summary">

                <div class="cart-summary-row">

                    <span class="text-secondary">
                        Total
                    </span>

                    <strong class="cart-total">

                        $
                        <span th:text="${cart.total}">
                            0.00
                        </span>

                    </strong>

                </div>

            </section>


            <!-- Actions -->

            <div class="flex gap-md mt-lg">

                <a class="btn btn-secondary"
                   href="/products">
                    Continue Shopping
                </a>

                <a class="btn btn-primary"
                   href="/checkout">
                    Proceed to Checkout
                </a>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
