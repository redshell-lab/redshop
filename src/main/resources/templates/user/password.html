<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Change Password')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                Change Password
            </h1>

            <p class="page-subtitle">
                Update your account password.
            </p>

        </div>

        <div class="alert alert-success"
             th:if="${param.updated}">
            Your password has been changed successfully.
        </div>

        <div class="alert alert-error"
             th:if="${param.error}">
            Current password is incorrect.
        </div>

        <div class="alert alert-error"
             th:if="${param.mismatch}">
            New password and confirmation do not match.
        </div>

        <section class="card">

            <div class="card-body">

                <h2 class="section-title">
                    Password
                </h2>

                <form th:action="@{/account/password}"
                      method="post">

                    <div class="form-group">

                        <label class="form-label"
                               for="currentPassword">
                            Current Password
                        </label>

                        <input type="password"
                               id="currentPassword"
                               name="currentPassword"
                               autocomplete="current-password"
                               required>

                    </div>

                    <div class="form-group">

                        <label class="form-label"
                               for="newPassword">
                            New Password
                        </label>

                        <input type="password"
                               id="newPassword"
                               name="newPassword"
                               autocomplete="new-password"
                               required>

                    </div>

                    <div class="form-group">

                        <label class="form-label"
                               for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               autocomplete="new-password"
                               required>

                    </div>

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <div class="flex gap-md mt-lg">

                        <button type="submit"
                                class="btn btn-primary">
                            Change Password
                        </button>

                        <a class="btn btn-secondary"
                           href="/account">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
