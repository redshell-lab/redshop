<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Profile')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                Profile
            </h1>

            <p class="page-subtitle">
                Manage your account information.
            </p>

        </div>

        <div class="alert alert-success"
             th:if="${param.updated}">
            Your profile has been updated successfully.
        </div>

        <section class="card">

            <div class="card-body">

                <h2 class="section-title">
                    Account Information
                </h2>

                <form th:action="@{/account/profile}" method="post">

                    <div class="form-group">

                        <label class="form-label"
                               for="username">
                            Username
                        </label>

                        <input type="text"
                               id="username"
                               th:value="${user.username}"
                               disabled>

                    </div>

                    <div class="form-group">

                        <label class="form-label"
                               for="firstName">
                            First Name
                        </label>

                        <input type="text"
                               id="firstName"
                               name="firstName"
                               th:value="${user.firstName}"
                               autocomplete="given-name"
                               required>

                    </div>

                    <div class="form-group">

                        <label class="form-label"
                               for="lastName">
                            Last Name
                        </label>

                        <input type="text"
                               id="lastName"
                               name="lastName"
                               th:value="${user.lastName}"
                               autocomplete="family-name"
                               required>

                    </div>

                    <div class="form-group">

                        <label class="form-label"
                               for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               th:value="${user.email}"
                               autocomplete="email"
                               required>

                    </div>

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <div class="flex gap-md mt-lg">

                        <button type="submit"
                                class="btn btn-primary">
                            Save Changes
                        </button>

                        <a class="btn btn-secondary"
                           href="/account">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
