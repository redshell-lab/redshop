<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Profile')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                Profile
            </h1>

            <p class="page-subtitle">
                User profile information.
            </p>

        </div>

        <section class="card">

            <div class="card-body">

                <h2 class="section-title">
                    Account Information
                </h2>

                <div class="account-details">

                    <div class="form-group">

                        <label class="form-label">
                            Username
                        </label>

                        <div class="text-secondary"
                             th:text="${user.username}">
                            username
                        </div>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            First Name
                        </label>

                        <div class="text-secondary"
                             th:text="${user.firstName}">
                            First Name
                        </div>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            Last Name
                        </label>

                        <div class="text-secondary"
                             th:text="${user.lastName}">
                            Last Name
                        </div>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            Email
                        </label>

                        <div class="text-secondary"
                             th:text="${user.email}">
                            email@example.com
                        </div>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            Role
                        </label>

                        <div>

                            <span class="badge badge-neutral"
                                  th:text="${user.role}">
                                USER
                            </span>

                        </div>

                    </div>

                </div>

                <div class="mt-lg">

                    <a class="btn btn-secondary"
                       href="/account">
                        Back to My Account
                    </a>

                </div>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
