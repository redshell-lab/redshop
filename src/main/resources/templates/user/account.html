<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('My Account')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                My Account
            </h1>

            <p class="page-subtitle">
                Manage your account information.
            </p>

        </div>

        <section class="card">

            <div class="card-body">

                <h2 class="section-title">
                    Profile
                </h2>

                <div class="account-details">

                    <div class="form-group">

                        <label class="form-label">
                            Username
                        </label>

                        <div class="text-secondary"
                             th:text="${user.username}">
                            username
                        </div>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            First Name
                        </label>

                        <div class="text-secondary"
                             th:text="${user.firstName}">
                            First Name
                        </div>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            Last Name
                        </label>

                        <div class="text-secondary"
                             th:text="${user.lastName}">
                            Last Name
                        </div>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            Email
                        </label>

                        <div class="text-secondary"
                             th:text="${user.email}">
                            email@example.com
                        </div>

                    </div>

                    <div class="form-group">

                        <label class="form-label">
                            Role
                        </label>

                        <div>

                            <span class="badge badge-neutral"
                                  th:text="${user.role}">
                                USER
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <div class="flex gap-md mt-lg">

            <a class="btn btn-secondary"
               href="/products">
                Continue Shopping
            </a>

            <a class="btn btn-secondary"
               href="/orders">
                My Orders
            </a>

            <form th:action="@{/logout}"
                  method="post">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >

                <button
                        type="submit"
                        class="btn btn-danger">
                    Logout
                </button>

            </form>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
