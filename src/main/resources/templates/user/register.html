<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Register')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-header">

            <h1 class="auth-title">
                Create your account
            </h1>

            <p class="auth-description">
                Create a RedShop account to start shopping.
            </p>

        </div>

        <form th:action="@{/register}"
              method="post">

            <div class="form-group">

                <label class="form-label"
                       for="firstName">
                    First Name
                </label>

                <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        autocomplete="given-name"
                        required
                >

            </div>

            <div class="form-group">

                <label class="form-label"
                       for="lastName">
                    Last Name
                </label>

                <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        autocomplete="family-name"
                        required
                >

            </div>

            <div class="form-group">

                <label class="form-label"
                       for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                >

            </div>

            <div class="form-group">

                <label class="form-label"
                       for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                >

            </div>

            <div class="form-group">

                <label class="form-label"
                       for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        required
                >

            </div>

            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
            >

            <button
                    type="submit"
                    class="btn btn-primary"
                    style="width: 100%;">
                Create Account
            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
