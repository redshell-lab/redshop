<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Address')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                Address
            </h1>

            <p class="page-subtitle">
                Manage your shipping userAddress.
            </p>

        </div>

        <div class="alert alert-success"
             th:if="${param.updated}">
            Your userAddress has been updated successfully.
        </div>

        <section class="card">

            <div class="card-body">

                <h2 class="section-title">
                    Shipping Address
                </h2>

                <form th:action="@{/account/address}"
                      method="post">

                    <div class="form-group">

                        <label class="form-label"
                               for="addressLine">
                            Address
                        </label>

                        <input type="text"
                               id="addressLine"
                               name="addressLine"
                               th:value="${userAddress != null ? userAddress.addressLine : ''}"
                               autocomplete="street-userAddress"
                               required>

                    </div>

                    <div class="form-group">

                        <label class="form-label"
                               for="city">
                            City
                        </label>

                        <input type="text"
                               id="city"
                               name="city"
                               th:value="${userAddress != null ? userAddress.city : ''}"
                               autocomplete="userAddress-level2"
                               required>

                    </div>

                    <div class="form-group">

                        <label class="form-label"
                               for="postalCode">
                            Postal Code
                        </label>

                        <input type="text"
                               id="postalCode"
                               name="postalCode"
                               th:value="${userAddress != null ? userAddress.postalCode : ''}"
                               autocomplete="postal-code"
                               required>

                    </div>

                    <div class="form-group">

                        <label class="form-label"
                               for="country">
                            Country
                        </label>

                        <input type="text"
                               id="country"
                               name="country"
                               th:value="${userAddress != null ? userAddress.country : ''}"
                               autocomplete="country-name"
                               required>

                    </div>

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <div class="flex gap-md mt-lg">

                        <button type="submit"
                                class="btn btn-primary">
                            Save Address
                        </button>

                        <a class="btn btn-secondary"
                           href="/account">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
