<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('My Orders')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                My Orders
            </h1>

            <p class="page-subtitle">
                View your previous orders and their status.
            </p>

        </div>

        <!-- Empty State -->

        <div class="card"
             th:if="${orders.isEmpty()}">

            <div class="empty-state">

                <h2 class="section-title">
                    No orders yet
                </h2>

                <p class="text-secondary">
                    You have not placed any orders yet.
                </p>

                <a class="btn btn-primary mt-md"
                   href="/products">
                    Start Shopping
                </a>

            </div>

        </div>


        <!-- Orders -->

        <div class="table-wrapper"
             th:unless="${orders.isEmpty()}">

            <table class="data-table">

                <thead>

                <tr>

                    <th>
                        Order
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Details
                    </th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="order : ${orders}">

                    <td>

                        <strong>
                            #
                            <span th:text="${order.id}">
                                1
                            </span>
                        </strong>

                    </td>

                    <td th:text="${order.createdAt}">
                        2026-01-01
                    </td>

                    <td>

                        <span class="badge badge-neutral"
                              th:text="${order.status}">
                            PENDING
                        </span>

                    </td>

                    <td>

                        $
                        <span th:text="${order.total}">
                            0.00
                        </span>

                    </td>

                    <td>

                        <a class="btn btn-secondary btn-sm"
                           th:href="@{/orders/{id}(id=${order.id})}">
                            View Order
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
