<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - RedShop</title>

</head>

<body>

<h1>My Orders</h1>

<p>
    <a href="/products">Products</a>
    |
    <a href="/cart">Cart</a>
    |
    <a href="/account">My Account</a>
</p>

<div th:if="${orders.isEmpty()}">

    <p>You have no orders yet.</p>

</div>

<table
        th:unless="${orders.isEmpty()}"
        border="1"
        cellpadding="10"
>

    <thead>

    <tr>
        <th>Order ID</th>
        <th>Date</th>
        <th>Status</th>
        <th>Total</th>
        <th>Details</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="order : ${orders}">

        <td th:text="${order.id}">
            1
        </td>

        <td th:text="${order.createdAt}">
            Date
        </td>

        <td th:text="${order.status}">
            PENDING
        </td>

        <td th:text="${order.total}">
            0.00
        </td>

        <td>
            <a
                    th:href="@{/orders/{id}(id=${order.id})}"
                    th:text="'View Order #' + ${order.id}">
                View
            </a>
        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
