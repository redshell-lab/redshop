<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Order Details')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-md">

            <a class="text-secondary"
               href="/orders">
                ← Back to orders
            </a>

        </div>

        <div class="mb-lg">

            <h1 class="page-title">

                Order #
                <span th:text="${order.id}">
                    1
                </span>

            </h1>

            <p class="page-subtitle">
                Review your order details and shipping information.
            </p>

        </div>


        <!-- Order Information -->

        <section class="card mb-lg">

            <div class="card-body">

                <div class="order-header">

                    <div>

                        <div class="form-label">
                            Order Date
                        </div>

                        <div th:text="${order.createdAt}">
                            2026-01-01
                        </div>

                    </div>

                    <div>

                        <div class="form-label">
                            Status
                        </div>

                        <span class="badge badge-neutral"
                              th:text="${order.status}">
                            PENDING
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- Order Items -->

        <section class="card mb-lg">

            <div class="card-body">

                <h2 class="section-title">
                    Order Items
                </h2>

                <div class="table-wrapper">

                    <table class="data-table">

                        <thead>

                        <tr>

                            <th>
                                Product
                            </th>

                            <th>
                                Quantity
                            </th>

                            <th>
                                Price
                            </th>

                            <th>
                                Subtotal
                            </th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="item : ${order.items}">

                            <td th:text="${item.product.name}">
                                Product
                            </td>

                            <td th:text="${item.quantity}">
                                1
                            </td>

                            <td>

                                $
                                <span th:text="${item.product.price}">
                                    0.00
                                </span>

                            </td>

                            <td>

                                $
                                <span th:text="${item.subtotal}">
                                    0.00
                                </span>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

                <div class="order-total">

                    <span>
                        Total
                    </span>

                    <strong>

                        $
                        <span th:text="${order.total}">
                            0.00
                        </span>

                    </strong>

                </div>

            </div>

        </section>


        <!-- Shipping Address -->

        <section class="card">

            <div class="card-body">

                <h2 class="section-title">
                    Shipping Address
                </h2>

                <div class="shipping-userAddress">

                    <div th:text="${order.userAddress.fullName}">
                        John Doe
                    </div>

                    <div th:text="${order.userAddress.street}">
                        123 Main Street
                    </div>

                    <div>

                        <span th:text="${order.userAddress.city}">
                            City
                        </span>

                        <span>
                            ,
                        </span>

                        <span th:text="${order.userAddress.postalCode}">
                            12345
                        </span>

                    </div>

                    <div th:text="${order.userAddress.phone}">
                        +123456789
                    </div>

                </div>

            </div>

        </section>


        <div class="mt-lg">

            <a class="btn btn-secondary"
               href="/products">
                Continue Shopping
            </a>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
