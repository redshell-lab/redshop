<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Checkout')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                Checkout
            </h1>

            <p class="page-subtitle">
                Review your order and enter your shipping information.
            </p>

        </div>

        <div class="checkout-layout">

            <!-- Order Summary -->

            <section class="card checkout-summary">

                <div class="card-body">

                    <h2 class="section-title">
                        Order Summary
                    </h2>

                    <div class="table-wrapper">

                        <table class="data-table">

                            <thead>

                            <tr>

                                <th>
                                    Product
                                </th>

                                <th>
                                    Quantity
                                </th>

                                <th>
                                    Price
                                </th>

                                <th>
                                    Subtotal
                                </th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="item : ${cart.items}">

                                <td th:text="${item.product.name}">
                                    Product
                                </td>

                                <td th:text="${item.quantity}">
                                    1
                                </td>

                                <td>

                                    $
                                    <span th:text="${item.product.price}">
                                        0.00
                                    </span>

                                </td>

                                <td>

                                    $
                                    <span th:text="${item.subtotal}">
                                        0.00
                                    </span>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                    <div class="checkout-total">

                        <span>
                            Total
                        </span>

                        <strong>

                            $
                            <span th:text="${cart.total}">
                                0.00
                            </span>

                        </strong>

                    </div>

                </div>

            </section>


            <!-- Shipping Information -->

            <section class="card">

                <div class="card-body">

                    <h2 class="section-title">
                        Shipping Information
                    </h2>

                    <form th:action="@{/checkout}"
                          method="post">

                        <div class="form-group">

                            <label class="form-label"
                                   for="fullName">
                                Full Name
                            </label>

                            <input
                                    type="text"
                                    id="fullName"
                                    name="fullName"
                                    autocomplete="name"
                                    required
                            >

                        </div>

                        <div class="form-group">

                            <label class="form-label"
                                   for="street">
                                Street Address
                            </label>

                            <input
                                    type="text"
                                    id="street"
                                    name="street"
                                    autocomplete="street-address"
                                    required
                            >

                        </div>

                        <div class="checkout-form-grid">

                            <div class="form-group">

                                <label class="form-label"
                                       for="city">
                                    City
                                </label>

                                <input
                                        type="text"
                                        id="city"
                                        name="city"
                                        autocomplete="address-level2"
                                        required
                                >

                            </div>

                            <div class="form-group">

                                <label class="form-label"
                                       for="postalCode">
                                    Postal Code
                                </label>

                                <input
                                        type="text"
                                        id="postalCode"
                                        name="postalCode"
                                        autocomplete="postal-code"
                                        required
                                >

                            </div>

                        </div>

                        <div class="form-group">

                            <label class="form-label"
                                   for="phone">
                                Phone
                            </label>

                            <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    autocomplete="tel"
                                    required
                            >

                        </div>

                        <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}"
                        >

                        <div class="checkout-actions">

                            <a class="btn btn-secondary"
                               href="/cart">
                                Back to Cart
                            </a>

                            <button
                                    type="submit"
                                    class="btn btn-primary">
                                Place Order
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
