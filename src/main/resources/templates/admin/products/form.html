<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Add Product</title>
</head>

<body>

<h1>RedShop Admin</h1>

<h2>Add Product</h2>

<form method="post" action="/admin/products">

    <div>
        <label for="name">Name:</label>
        <input
                type="text"
                id="name"
                name="name"
                required
        >
    </div>

    <br>

    <div>
        <label for="description">Description:</label>
        <textarea
                id="description"
                name="description"
                rows="5"
                cols="40"
        ></textarea>
    </div>

    <br>

    <div>
        <label for="price">Price:</label>
        <input
                type="number"
                id="price"
                name="price"
                step="0.01"
                min="0"
                required
        >
    </div>

    <br>

    <div>
        <label for="stock">Stock:</label>
        <input
                type="number"
                id="stock"
                name="stock"
                min="0"
                required
        >
    </div>

    <br>

    <div>
        <label for="category">Category:</label>

        <select
                id="category"
                name="categoryId"
                required
        >

            <option value="">
                -- Select Category --
            </option>

            <option
                    th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}">
            </option>

        </select>
    </div>

    <br>

    <button type="submit">
        Create Product
    </button>

</form>

<br>

<a href="/admin/products">
    Back to Products
</a>

</body>
</html>
