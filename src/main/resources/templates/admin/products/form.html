<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${product != null ? 'Admin - Edit Product' : 'Admin - Add Product'}">
        Admin - Product
    </title>
</head>

<body>

<h1>RedShop Admin</h1>

<h2 th:text="${product != null ? 'Edit Product' : 'Add Product'}">
    Product
</h2>

<form
        method="post"
        th:action="${product != null
            ? '/admin/products/' + product.id
            : '/admin/products'}"
>

    <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
    >

    <div>
        <label for="name">Name:</label>

        <input
                type="text"
                id="name"
                name="name"
                th:value="${product != null ? product.name : ''}"
                required
        >
    </div>

    <br>

    <div>
        <label for="description">Description:</label>

        <textarea
                id="description"
                name="description"
                rows="5"
                cols="40"
                th:text="${product != null ? product.description : ''}"
        ></textarea>
    </div>

    <br>

    <div>
        <label for="price">Price:</label>

        <input
                type="number"
                id="price"
                name="price"
                step="0.01"
                min="0"
                th:value="${product != null ? product.price : ''}"
                required
        >
    </div>

    <br>

    <div>
        <label for="stock">Stock:</label>

        <input
                type="number"
                id="stock"
                name="stock"
                min="0"
                th:value="${product != null ? product.stock : ''}"
                required
        >
    </div>

    <br>

    <div>
        <label for="category">Category:</label>

        <select
                id="category"
                name="categoryId"
                required
        >

            <option value="">
                -- Select Category --
            </option>

            <option
                    th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}"
                    th:selected="${product != null
                        and product.category != null
                        and product.category.id == category.id}">
            </option>

        </select>
    </div>

    <br>

    <button
            type="submit"
            th:text="${product != null ? 'Update Product' : 'Create Product'}">
        Save
    </button>

</form>

<br>

<a href="/admin/products">
    Back to Products
</a>

</body>
</html>
