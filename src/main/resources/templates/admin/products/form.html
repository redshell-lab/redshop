<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header(${product != null ? 'Edit Product' : 'Add Product'})}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="admin-page-header">
            <div>
                <h1 class="page-title"
                    th:text="${product != null ? 'Edit Product' : 'Add Product'}">
                    Product
                </h1>

                <p class="page-subtitle">
                    Manage product information, pricing, stock, and category.
                </p>
            </div>
        </div>

        <div class="admin-form-card">

            <form
                    method="post"
                    th:action="${product != null
                        ? '/admin/products/' + product.id
                        : '/admin/products'}">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >

                <div class="admin-form-grid">

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="name">
                            Name
                        </label>

                        <input
                                type="text"
                                id="name"
                                name="name"
                                th:value="${product != null
                                    ? product.name
                                    : ''}"
                                required
                        >

                    </div>

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="price">
                            Price
                        </label>

                        <input
                                type="number"
                                id="price"
                                name="price"
                                step="0.01"
                                min="0"
                                th:value="${product != null
                                    ? product.price
                                    : ''}"
                                required
                        >

                    </div>

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="stock">
                            Stock
                        </label>

                        <input
                                type="number"
                                id="stock"
                                name="stock"
                                min="0"
                                th:value="${product != null
                                    ? product.stock
                                    : ''}"
                                required
                        >

                    </div>

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="category">
                            Category
                        </label>

                        <select
                                id="category"
                                name="categoryId"
                                required>

                            <option value="">
                                -- Select Category --
                            </option>

                            <option
                                    th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"
                                    th:selected="${product != null
                                        and product.category != null
                                        and product.category.id == category.id}">
                            </option>

                        </select>

                    </div>

                </div>

                <div class="form-group">

                    <label
                            class="form-label"
                            for="description">
                        Description
                    </label>

                    <textarea
                            id="description"
                            name="description"
                            rows="6"
                            th:text="${product != null
                                ? product.description
                                : ''}">
                    </textarea>

                </div>

                <div class="admin-form-actions">

                    <a
                            href="/admin/products"
                            class="btn btn-secondary">
                        Cancel
                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary"
                            th:text="${product != null
                                ? 'Update Product'
                                : 'Create Product'}">
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
