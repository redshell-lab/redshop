<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Categories</title>
</head>

<body>

<h1>RedShop Admin</h1>

<h2>Categories</h2>

<a href="/admin/categories/new">
    Add Category
</a>

<br>
<br>

<table border="1">

    <thead>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="category : ${categories}">

        <td th:text="${category.id}">
            1
        </td>

        <td th:text="${category.name}">
            Laptops
        </td>

        <td>

            <a
                    th:href="@{/admin/categories/{id}/edit(id=${category.id})}">
                Edit
            </a>

            &nbsp;

            <form
                    method="post"
                    th:action="@{/admin/categories/{id}/delete(id=${category.id})}"
                    style="display:inline"
            >

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >

                <button type="submit">
                    Delete
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

<br>

<a href="/admin">
    Back to Dashboard
</a>

</body>
</html>
