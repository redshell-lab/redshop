<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Categories</title>
</head>

<body>

<h1>RedShop Admin</h1>

<h2>Categories</h2>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="category : ${categories}">

        <td th:text="${category.id}">
            1
        </td>

        <td th:text="${category.name}">
            Laptops
        </td>

    </tr>

    </tbody>

</table>

<br>

<a href="/admin">
    Back to Dashboard
</a>

</body>
</html>
