<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Manage Categories')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="admin-page-header">

            <div>

                <h1 class="page-title">
                    Categories
                </h1>

                <p class="page-subtitle">
                    Manage product categories.
                </p>

            </div>

            <a class="btn btn-primary"
               href="/admin/categories/new">
                Add Category
            </a>

        </div>


        <div class="table-wrapper">

            <table class="data-table">

                <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="category : ${categories}">

                    <td th:text="${category.id}">
                        1
                    </td>

                    <td>

                        <strong th:text="${category.name}">
                            Category
                        </strong>

                    </td>

                    <td>

                        <div class="table-actions">

                            <a
                                    class="btn btn-secondary btn-sm"
                                    th:href="@{/admin/categories/{id}/edit(id=${category.id})}">
                                Edit
                            </a>

                            <form
                                    th:action="@{/admin/categories/{id}/delete(id=${category.id})}"
                                    method="post">

                                <input
                                        type="hidden"
                                        th:name="${_csrf.parameterName}"
                                        th:value="${_csrf.token}"
                                >

                                <button
                                        type="submit"
                                        class="btn btn-danger btn-sm">
                                    Delete
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <div class="mt-lg">

            <a class="btn btn-secondary"
               href="/admin">
                Back to Dashboard
            </a>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
