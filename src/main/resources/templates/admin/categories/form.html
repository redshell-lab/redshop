<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header(${category.id == null ? 'Add Category' : 'Edit Category'})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title"
                th:text="${category.id == null ? 'Add Category' : 'Edit Category'}">
                Add Category
            </h1>

            <p class="page-subtitle">
                Enter category information.
            </p>

        </div>


        <section class="card admin-form-card">

            <div class="card-body">

                <form
                        th:action="${category.id == null
                            ? '/admin/categories'
                            : '/admin/categories/' + category.id}"
                        method="post">

                    <div class="form-group">

                        <label class="form-label"
                               for="name">
                            Category Name
                        </label>

                        <input
                                type="text"
                                id="name"
                                name="name"
                                th:value="${category.name}"
                                required
                        >

                    </div>


                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                    >


                    <div class="admin-form-actions">

                        <a class="btn btn-secondary"
                           href="/admin/categories">
                            Cancel
                        </a>

                        <button
                                type="submit"
                                class="btn btn-primary"
                                th:text="${category.id == null
                                    ? 'Create Category'
                                    : 'Save Changes'}">
                            Save
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
