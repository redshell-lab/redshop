<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header(${category != null ? 'Edit Category' : 'Add Category'})}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="admin-page-header">
            <div>
                <h1 class="page-title"
                    th:text="${category != null ? 'Edit Category' : 'Add Category'}">
                    Category
                </h1>

                <p class="page-subtitle">
                    Manage product categories.
                </p>
            </div>
        </div>

        <div class="admin-form-card">

            <form
                    method="post"
                    th:action="${category != null
                        ? '/admin/categories/' + category.id
                        : '/admin/categories'}">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >

                <div class="form-group">

                    <label
                            class="form-label"
                            for="name">
                        Name
                    </label>

                    <input
                            type="text"
                            id="name"
                            name="name"
                            th:value="${category != null
                                ? category.name
                                : ''}"
                            required
                    >

                </div>

                <div class="admin-form-actions">

                    <a
                            href="/admin/categories"
                            class="btn btn-secondary">
                        Cancel
                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary"
                            th:text="${category != null
                                ? 'Update Category'
                                : 'Create Category'}">
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
