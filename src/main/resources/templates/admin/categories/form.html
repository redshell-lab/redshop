<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title
            th:text="${category != null
                ? 'Admin - Edit Category'
                : 'Admin - Add Category'}">
        Admin - Category
    </title>
</head>

<body>

<h1>RedShop Admin</h1>

<h2
        th:text="${category != null
            ? 'Edit Category'
            : 'Add Category'}">
    Category
</h2>

<form
        method="post"
        th:action="${category != null
            ? '/admin/categories/' + category.id
            : '/admin/categories'}"
>

    <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
    >

    <div>

        <label for="name">
            Name:
        </label>

        <input
                type="text"
                id="name"
                name="name"
                th:value="${category != null
                    ? category.name
                    : ''}"
                required
        >

    </div>

    <br>

    <button
            type="submit"
            th:text="${category != null
                ? 'Update Category'
                : 'Create Category'}">
        Save
    </button>

</form>

<br>

<a href="/admin/categories">
    Back to Categories
</a>

</body>
</html>
