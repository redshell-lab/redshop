<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Manage Products')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="admin-page-header">

            <div>

                <h1 class="page-title">
                    Products
                </h1>

                <p class="page-subtitle">
                    Manage products available in RedShop.
                </p>

            </div>

            <a class="btn btn-primary"
               href="/admin/products/new">
                Add Product
            </a>

        </div>


        <div class="table-wrapper">

            <table class="data-table">

                <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Stock
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="product : ${products}">

                    <td th:text="${product.id}">
                        1
                    </td>

                    <td>

                        <a class="table-link"
                           th:href="@{/products/{id}(id=${product.id})}"
                           th:text="${product.name}">
                            Product
                        </a>

                    </td>

                    <td th:text="${product.category.name}">
                        Category
                    </td>

                    <td>

                        $
                        <span th:text="${product.price}">
                            0.00
                        </span>

                    </td>

                    <td>

                        <span th:text="${product.stock}">
                            0
                        </span>

                    </td>

                    <td>

                        <div class="table-actions">

                            <a class="btn btn-secondary btn-sm"
                               th:href="@{/admin/products/{id}/edit(id=${product.id})}">
                                Edit
                            </a>

                            <form
                                    th:action="@{/admin/products/{id}/delete(id=${product.id})}"
                                    method="post">

                                <input
                                        type="hidden"
                                        th:name="${_csrf.parameterName}"
                                        th:value="${_csrf.token}"
                                >

                                <button
                                        type="submit"
                                        class="btn btn-danger btn-sm">
                                    Delete
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <div class="mt-lg">

            <a class="btn btn-secondary"
               href="/admin">
                Back to Dashboard
            </a>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
