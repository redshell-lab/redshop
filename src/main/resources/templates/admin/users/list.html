<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Manage Users')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="admin-page-header">

            <div>

                <h1 class="page-title">
                    Users
                </h1>

                <p class="page-subtitle">
                    Manage RedShop user accounts and roles.
                </p>

            </div>

            <a class="btn btn-primary"
               href="/admin/users/new">
                Add User
            </a>

        </div>


        <section class="admin-table-card">

            <div class="table-wrapper">

                <table class="data-table">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.id}">
                            1
                        </td>

                        <td>

                            <strong th:text="${user.username}">
                                username
                            </strong>

                        </td>

                        <td th:text="${user.email}">
                            email@example.com
                        </td>

                        <td>

                            <span th:text="${user.firstName}">
                                First
                            </span>

                            <span>

                            </span>

                            <span th:text="${user.lastName}">
                                Last
                            </span>

                        </td>

                        <td>

                            <span class="badge badge-neutral"
                                  th:text="${user.role}">
                                USER
                            </span>

                        </td>

                        <td>

                            <div class="admin-table-actions">

                                <a
                                        class="btn btn-secondary btn-sm"
                                        th:href="@{/admin/users/{id}/edit(id=${user.id})}">
                                    Edit
                                </a>

                                <form
                                        th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                        method="post">

                                    <input
                                            type="hidden"
                                            th:name="${_csrf.parameterName}"
                                            th:value="${_csrf.token}"
                                    >

                                    <button
                                            type="submit"
                                            class="btn btn-danger btn-sm">
                                        Delete
                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>


        <div class="admin-bottom-actions">

            <a class="btn btn-secondary"
               href="/admin">
                ← Dashboard
            </a>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
