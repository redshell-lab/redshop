<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Admin - Users</title>

</head>

<body>

<h1>RedShop Admin</h1>

<h2>Users</h2>

<a href="/admin/users/new">
    Add User
</a>

<br>
<br>

<table border="1">

    <thead>

    <tr>

        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Role</th>
        <th>Actions</th>

    </tr>

    </thead>

    <tbody>

    <tr th:each="user : ${users}">

        <td th:text="${user.id}">
            1
        </td>

        <td th:text="${user.username}">
            ehsan
        </td>

        <td th:text="${user.email}">
            ehsan@redshop.local
        </td>

        <td th:text="${user.firstName}">
            Ehsan
        </td>

        <td th:text="${user.lastName}">
            RedShell
        </td>

        <td th:text="${user.role}">
            USER
        </td>

        <td>

            <a
                    th:href="@{/admin/users/{id}/edit(id=${user.id})}">
                Edit
            </a>

            &nbsp;

            <form
                    method="post"
                    th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                    style="display:inline"
            >

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >

                <button type="submit">
                    Delete
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

<br>

<a href="/admin">
    Back to Dashboard
</a>

</body>
</html>
