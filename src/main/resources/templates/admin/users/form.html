<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header(${user.id == null ? 'Add User' : 'Edit User'})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="admin-page-header">

            <div>

                <h1 class="page-title"
                    th:text="${user.id == null ? 'Add User' : 'Edit User'}">
                    Add User
                </h1>

                <p class="page-subtitle">
                    Manage user account information and role.
                </p>

            </div>

        </div>


        <section class="admin-form-card">

            <form
                    th:action="${user.id == null
                        ? '/admin/users'
                        : '/admin/users/' + user.id}"
                    method="post">

                <div class="admin-form-grid">

                    <div class="form-group">

                        <label class="form-label"
                               for="firstName">
                            First Name
                        </label>

                        <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                th:value="${user.firstName}"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label"
                               for="lastName">
                            Last Name
                        </label>

                        <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                th:value="${user.lastName}"
                                required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label class="form-label"
                           for="username">
                        Username
                    </label>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            th:value="${user.username}"
                            autocomplete="username"
                            required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label"
                           for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            th:value="${user.email}"
                            autocomplete="email"
                            required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label"
                           for="password">
                        Password
                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            th:required="${user.id == null}"
                    >

                    <div class="form-help"
                         th:if="${user.id != null}">
                        Leave blank to keep the current password.
                    </div>

                </div>


                <div class="form-group">

                    <label class="form-label"
                           for="role">
                        Role
                    </label>

                    <select
                            id="role"
                            name="role"
                            required>

                        <option value="">
                            Select role
                        </option>

                        <option value="USER"
                                th:selected="${user.role != null
                                    and user.role.toString() == 'USER'}">
                            USER
                        </option>

                        <option value="ADMIN"
                                th:selected="${user.role != null
                                    and user.role.toString() == 'ADMIN'}">
                            ADMIN
                        </option>

                    </select>

                </div>


                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >


                <div class="admin-form-actions">

                    <a class="btn btn-secondary"
                       href="/admin/users">
                        Cancel
                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary"
                            th:text="${user.id == null
                                ? 'Create User'
                                : 'Save Changes'}">
                        Save
                    </button>

                </div>

            </form>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
