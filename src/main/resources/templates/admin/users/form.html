<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header(${user != null ? 'Edit User' : 'Add User'})}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="admin-page-header">
            <div>
                <h1 class="page-title"
                    th:text="${user != null ? 'Edit User' : 'Add User'}">
                    User
                </h1>

                <p class="page-subtitle">
                    Manage user account information and access role.
                </p>
            </div>
        </div>

        <div class="admin-form-card">

            <form
                    method="post"
                    th:action="${user != null
                        ? '/admin/users/' + user.id
                        : '/admin/users'}">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                >

                <div class="admin-form-grid">

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="username">
                            Username
                        </label>

                        <input
                                type="text"
                                id="username"
                                name="username"
                                th:value="${user != null
                                    ? user.username
                                    : ''}"
                                th:readonly="${user != null}"
                                required
                        >

                    </div>

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="email">
                            Email
                        </label>

                        <input
                                type="email"
                                id="email"
                                name="email"
                                th:value="${user != null
                                    ? user.email
                                    : ''}"
                                required
                        >

                    </div>

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="password">
                            Password
                        </label>

                        <input
                                type="password"
                                id="password"
                                name="password"
                                th:required="${user == null}"
                        >

                        <div
                                class="form-help"
                                th:if="${user != null}">
                            Leave empty to keep the current password.
                        </div>

                    </div>

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="role">
                            Role
                        </label>

                        <select
                                id="role"
                                name="role"
                                required>

                            <option
                                    value="USER"
                                    th:selected="${user != null
                                        and user.role == 'USER'}">
                                USER
                            </option>

                            <option
                                    value="ADMIN"
                                    th:selected="${user != null
                                        and user.role == 'ADMIN'}">
                                ADMIN
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="firstName">
                            First Name
                        </label>

                        <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                th:value="${user != null
                                    ? user.firstName
                                    : ''}"
                                required
                        >

                    </div>

                    <div class="form-group">

                        <label
                                class="form-label"
                                for="lastName">
                            Last Name
                        </label>

                        <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                th:value="${user != null
                                    ? user.lastName
                                    : ''}"
                                required
                        >

                    </div>

                </div>

                <div class="admin-form-actions">

                    <a
                            href="/admin/users"
                            class="btn btn-secondary">
                        Cancel
                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary"
                            th:text="${user != null
                                ? 'Update User'
                                : 'Create User'}">
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
