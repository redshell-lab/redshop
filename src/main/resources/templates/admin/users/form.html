<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header(${product.id == null ? 'Add Product' : 'Edit Product'})}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title"
                th:text="${product.id == null ? 'Add Product' : 'Edit Product'}">
                Add Product
            </h1>

            <p class="page-subtitle">
                Enter product information.
            </p>

        </div>


        <section class="card admin-form-card">

            <div class="card-body">

                <form
                        th:action="${product.id == null
                            ? '/admin/products'
                            : '/admin/products/' + product.id}"
                        method="post">

                    <div class="form-group">

                        <label class="form-label"
                               for="name">
                            Product Name
                        </label>

                        <input
                                type="text"
                                id="name"
                                name="name"
                                th:value="${product.name}"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label"
                               for="description">
                            Description
                        </label>

                        <textarea
                                id="description"
                                name="description"
                                rows="5"
                                th:text="${product.description}"
                                required></textarea>

                    </div>


                    <div class="admin-form-grid">

                        <div class="form-group">

                            <label class="form-label"
                                   for="price">
                                Price
                            </label>

                            <input
                                    type="number"
                                    id="price"
                                    name="price"
                                    step="0.01"
                                    min="0"
                                    th:value="${product.price}"
                                    required
                            >

                        </div>


                        <div class="form-group">

                            <label class="form-label"
                                   for="stock">
                                Stock
                            </label>

                            <input
                                    type="number"
                                    id="stock"
                                    name="stock"
                                    min="0"
                                    th:value="${product.stock}"
                                    required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label class="form-label"
                               for="category">
                            Category
                        </label>

                        <select
                                id="category"
                                name="categoryId"
                                required>

                            <option value="">
                                Select category
                            </option>

                            <option
                                    th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}"
                                    th:selected="${product.category != null
                                        and product.category.id == category.id}">
                                Category
                            </option>

                        </select>

                    </div>


                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                    >


                    <div class="admin-form-actions">

                        <a class="btn btn-secondary"
                           href="/admin/products">
                            Cancel
                        </a>

                        <button
                                type="submit"
                                class="btn btn-primary"
                                th:text="${product.id == null
                                    ? 'Create Product'
                                    : 'Save Changes'}">
                            Save
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
