<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title
            th:text="${user != null
                ? 'Admin - Edit User'
                : 'Admin - Add User'}">
        Admin - User
    </title>

</head>

<body>

<h1>RedShop Admin</h1>

<h2
        th:text="${user != null
            ? 'Edit User'
            : 'Add User'}">
    User
</h2>

<form
        method="post"
        th:action="${user != null
            ? '/admin/users/' + user.id
            : '/admin/users'}"
>

    <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
    >

    <!-- Username -->

    <div>

        <label for="username">
            Username:
        </label>

        <input
                type="text"
                id="username"
                name="username"
                th:value="${user != null
                    ? user.username
                    : ''}"
                th:readonly="${user != null}"
                required
        >

    </div>

    <br>

    <!-- Email -->

    <div>

        <label for="email">
            Email:
        </label>

        <input
                type="email"
                id="email"
                name="email"
                th:value="${user != null
                    ? user.email
                    : ''}"
                required
        >

    </div>

    <br>

    <!-- Password -->

    <div>

        <label for="password">
            Password:
        </label>

        <input
                type="password"
                id="password"
                name="password"
                th:required="${user == null}"
        >

        <div th:if="${user != null}">
            Leave empty to keep the current password.
        </div>

    </div>

    <br>

    <!-- First Name -->

    <div>

        <label for="firstName">
            First Name:
        </label>

        <input
                type="text"
                id="firstName"
                name="firstName"
                th:value="${user != null
                    ? user.firstName
                    : ''}"
                required
        >

    </div>

    <br>

    <!-- Last Name -->

    <div>

        <label for="lastName">
            Last Name:
        </label>

        <input
                type="text"
                id="lastName"
                name="lastName"
                th:value="${user != null
                    ? user.lastName
                    : ''}"
                required
        >

    </div>

    <br>

    <!-- Role -->

    <div>

        <label for="role">
            Role:
        </label>

        <select
                id="role"
                name="role"
                required
        >

            <option
                    value="USER"
                    th:selected="${user != null
                        and user.role == 'USER'}">
                USER
            </option>

            <option
                    value="ADMIN"
                    th:selected="${user != null
                        and user.role == 'ADMIN'}">
                ADMIN
            </option>

        </select>

    </div>

    <br>

    <button
            type="submit"
            th:text="${user != null
                ? 'Update User'
                : 'Create User'}">
        Save
    </button>

</form>

<br>

<a href="/admin/users">
    Back to Users
</a>

</body>
</html>
