<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Admin Dashboard')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="mb-lg">

            <h1 class="page-title">
                Admin Dashboard
            </h1>

            <p class="page-subtitle">
                Manage RedShop users, products, categories, and orders.
            </p>

        </div>


        <!-- Statistics -->

        <section class="admin-stats">

            <div class="card">

                <div class="card-body">

                    <div class="stat-label">
                        Users
                    </div>

                    <div class="stat-value"
                         th:text="${userCount}">
                        0
                    </div>

                </div>

            </div>


            <div class="card">

                <div class="card-body">

                    <div class="stat-label">
                        Products
                    </div>

                    <div class="stat-value"
                         th:text="${productCount}">
                        0
                    </div>

                </div>

            </div>


            <div class="card">

                <div class="card-body">

                    <div class="stat-label">
                        Orders
                    </div>

                    <div class="stat-value"
                         th:text="${orderCount}">
                        0
                    </div>

                </div>

            </div>

        </section>


        <!-- Management -->

        <section class="mt-xl">

            <h2 class="section-title">
                Management
            </h2>

            <div class="admin-links">

                <a class="card admin-link"
                   href="/admin/products">

                    <div class="card-body">

                        <h3>
                            Products
                        </h3>

                        <p>
                            Create, edit, and remove products.
                        </p>

                    </div>

                </a>


                <a class="card admin-link"
                   href="/admin/categories">

                    <div class="card-body">

                        <h3>
                            Categories
                        </h3>

                        <p>
                            Manage product categories.
                        </p>

                    </div>

                </a>


                <a class="card admin-link"
                   href="/admin/users">

                    <div class="card-body">

                        <h3>
                            Users
                        </h3>

                        <p>
                            Manage user accounts and roles.
                        </p>

                    </div>

                </a>


                <a class="card admin-link"
                   href="/admin/orders">

                    <div class="card-body">

                        <h3>
                            Orders
                        </h3>

                        <p>
                            Review and manage customer orders.
                        </p>

                    </div>

                </a>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
