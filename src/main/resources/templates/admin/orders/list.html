<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Manage Orders')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <div class="container">

        <div class="admin-page-header">

            <div>

                <h1 class="page-title">
                    Orders
                </h1>

                <p class="page-subtitle">
                    Review and manage customer orders.
                </p>

            </div>

        </div>


        <section class="admin-table-card">

            <div class="table-wrapper">

                <table class="data-table">

                    <thead>

                    <tr>

                        <th>Order</th>
                        <th>User</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Total</th>
                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="order : ${orders}">

                        <td>

                            <strong>
                                #
                                <span th:text="${order.id}">
                                    1
                                </span>
                            </strong>

                        </td>

                        <td th:text="${order.user.username}">
                            username
                        </td>

                        <td th:text="${order.createdAt}">
                            2026-01-01
                        </td>

                        <td>

                            <span class="badge badge-neutral"
                                  th:text="${order.status}">
                                PENDING
                            </span>

                        </td>

                        <td>

                            $
                            <span th:text="${order.total}">
                                0.00
                            </span>

                        </td>

                        <td>

                            <a class="btn btn-secondary btn-sm"
                               th:href="@{/admin/orders/{id}(id=${order.id})}">
                                View
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>


        <div class="admin-bottom-actions">

            <a class="btn btn-secondary"
               href="/admin">
                ← Dashboard
            </a>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
