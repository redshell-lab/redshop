#   script:
#     - trivy image --exit-code 1 --severity HIGH,CRITICAL redshop/redshop:$CI_COMMIT_SHORT_SHA


deploy:
  stage: deploy
  image: docker:27-cli

  needs:
    - job: package

  resource_group: app-vm

  environment:
    name: app-vm
    url: http://192.168.59.135

  script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
    - export IMAGE="redshop/redshop:$CI_COMMIT_SHORT_SHA"

    - docker image inspect "$IMAGE"

    - |
      docker save "$IMAGE" | ssh \
        -i "$SSH_PRIVATE_KEY" \
        -o IdentitiesOnly=yes \
        -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
        -o StrictHostKeyChecking=yes \
        app@192.168.59.135 \
        "docker load"

    - |
      ssh \
        -i "$SSH_PRIVATE_KEY" \
        -o IdentitiesOnly=yes \
        -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
        -o StrictHostKeyChecking=yes \
        app@192.168.59.135 \
        "docker stop redshop || true; \
         docker rm redshop || true; \
         docker run -d \
           --name redshop \
           --restart unless-stopped \
           --network redshop-net \
           -p 127.0.0.1:8080:8080 \
           -v /home/app/redshop/logs:/app/logs \
           $IMAGE"

    - |
      ssh \
        -i "$SSH_PRIVATE_KEY" \
        -o IdentitiesOnly=yes \
        -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
        -o StrictHostKeyChecking=yes \
        app@192.168.59.135 \
        '
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/; then
              exit 0
            fi
            sleep 1
          done
          echo "Spring Boot did not become ready within 30 seconds"
          docker logs --tail 100 redshop
          exit 1
        '

    - |
      ssh \
        -i "$SSH_PRIVATE_KEY" \
        -o IdentitiesOnly=yes \
        -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
        -o StrictHostKeyChecking=yes \
        app@192.168.59.135 \
        "systemctl is-active --quiet nginx"

    - |
      ssh \
        -i "$SSH_PRIVATE_KEY" \
        -o IdentitiesOnly=yes \
        -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
        -o StrictHostKeyChecking=yes \
        app@192.168.59.135 \
        "curl --fail --silent --show-error http://127.0.0.1/"


