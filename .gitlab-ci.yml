stages:
  - build
  - test
  - sast
  - sca

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean package -DskipTests

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn test

sast:
  stage: sast
  image: redshop/opengrep:1.30.0
  script:
    - opengrep scan --config auto --error .

sca-sbom:
  stage: sca
  image: redshop/syft:1.51.1
  script:
    - syft dir:. -o syft-json=sbom.json
  artifacts:
    paths:
      - sbom.json

sca-scan:
  stage: sca
  image: redshop/grype:0.118.0
  needs:
    - job: sca-sbom
      artifacts: true
  script:
    - grype sbom:sbom.json