stages:
  - build
  - test
  - sast
  # - sca
  # - secrets
  - package
  # - trivy
  - deploy
# - dast


build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -Dmaven.repo.local=/cache/maven clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar


test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -Dmaven.repo.local=/cache/maven test

  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml


sast:
  stage: sast
  image: redshop/opengrep:1.30.0
  script:
    - opengrep scan --config p/java --config redshop-sast-rules/command-injection.yml --error .


